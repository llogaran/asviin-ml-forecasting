[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asviin-ml-forecasting"
version = "0.1.0"
description = "AI/MLOps extension of the Asviin ERP: demand forecasting, inventory recommendations, drift monitoring and a natural-language assistant."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Asviin ML Forecasting" }]
keywords = ["mlops", "demand-forecasting", "xgboost", "fastapi", "inventory", "drift-detection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pandas>=2.2,<3",
    "numpy>=1.26,<2.3",
    "scikit-learn>=1.5,<2",
    "xgboost>=2.0,<3",
    "joblib>=1.4,<2",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1"]
ml = ["shap>=0.45,<1", "statsmodels>=0.14,<1"]
notebooks = ["jupyter>=1.0", "matplotlib>=3.8", "seaborn>=0.13", "shap>=0.45"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
